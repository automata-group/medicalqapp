name: Import Questions (Dedicated Pipeline)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/insert_file2_questions.sql'
      - 'backend/insert_file1_questions.sql'
      - 'backend/insert_missing_questions.sql'
      - 'backend/scripts/import_docx_safe.js'

jobs:
  import-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Migration Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/insert_file2_questions.sql,backend/insert_file1_questions.sql,backend/insert_missing_questions.sql"
          target: "/opt/medical-qbank"

      - name: Execute Deduplicated Import on Database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "======================================================"
            echo "🚀 STARTING DEDUPLICATED QUESTIONS PIPELINE IMPORT"
            echo "======================================================"
            cd /opt/medical-qbank
            SUDO_PW="${{ secrets.SERVER_PASSWORD }}"

            DB_PASSWORD=$(grep -E '^DB_PASS=' /opt/medical-qbank/.env 2>/dev/null | cut -d '=' -f2- | tr -d '\r"' || echo "")
            if [ -z "$DB_PASSWORD" ]; then
                DB_PASSWORD="${DB_PASS:-Saadshabib.12}"
            fi

            echo "1. Checking question count in DB BEFORE import..."
            BEFORE_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank 2>/dev/null || echo "0")
            echo "Total questions before import: $BEFORE_COUNT"

            FILE2="/opt/medical-qbank/backend/insert_file2_questions.sql"
            [ ! -f "$FILE2" ] && FILE2="/opt/medical-qbank/insert_file2_questions.sql"

            if [ -f "$FILE2" ]; then
                echo "2. Transferring File 2 migration (633 questions) into MySQL container..."
                echo "$SUDO_PW" | sudo -S docker cp "$FILE2" medical_qbank_db:/tmp/file2.sql
                
                echo "3. Executing deduplicated import for File 2..."
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "source /tmp/file2.sql"
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db rm -f /tmp/file2.sql
                echo "✅ File 2 migration completed successfully!"
            fi

            FILE1="/opt/medical-qbank/backend/insert_file1_questions.sql"
            [ ! -f "$FILE1" ] && FILE1="/opt/medical-qbank/insert_file1_questions.sql"

            if [ -f "$FILE1" ]; then
                echo "4. Transferring File 1 migration into MySQL container..."
                echo "$SUDO_PW" | sudo -S docker cp "$FILE1" medical_qbank_db:/tmp/file1.sql
                
                echo "5. Executing deduplicated import for File 1..."
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "source /tmp/file1.sql"
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db rm -f /tmp/file1.sql
                echo "✅ File 1 migration completed successfully!"
            fi

            SQL_FILE="/opt/medical-qbank/backend/insert_missing_questions.sql"
            [ ! -f "$SQL_FILE" ] && SQL_FILE="/opt/medical-qbank/insert_missing_questions.sql"

            if [ -f "$SQL_FILE" ]; then
                echo "6. Transferring auxiliary migration into MySQL container..."
                echo "$SUDO_PW" | sudo -S docker cp "$SQL_FILE" medical_qbank_db:/tmp/missing_questions.sql
                
                echo "7. Executing deduplicated import..."
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "source /tmp/missing_questions.sql"
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db rm -f /tmp/missing_questions.sql
                echo "✅ Migration completed successfully!"
            fi

            echo "8. Checking question count in DB AFTER import..."
            AFTER_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank 2>/dev/null || echo "0")

            NEW_ADDED=$((AFTER_COUNT - BEFORE_COUNT))
            echo ""
            echo "======================================================"
            echo "📊 DEDUPLICATION & IMPORT REPORT:"
            echo "   Previous Total:   $BEFORE_COUNT questions"
            echo "   New Questions:    +$NEW_ADDED added"
            echo "   New Total:        $AFTER_COUNT questions"
            echo "======================================================"
            echo "🎉 Pipeline finished cleanly with zero duplicates!"
