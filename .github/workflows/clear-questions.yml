name: Clear All Questions (Production Pipeline)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/clear_all_questions.sql'

jobs:
  clear-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Clear Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/clear_all_questions.sql"
          target: "/opt/medical-qbank"

      - name: Execute Questions Wipe on Production Database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "======================================================"
            echo "⚠️ WIPING ALL QUESTIONS FROM PRODUCTION DATABASE"
            echo "======================================================"
            cd /opt/medical-qbank
            SUDO_PW="${{ secrets.SERVER_PASSWORD }}"

            DB_PASSWORD=$(grep -E '^DB_PASS=' /opt/medical-qbank/.env 2>/dev/null | cut -d '=' -f2- | tr -d '\r"' || echo "")
            if [ -z "$DB_PASSWORD" ]; then
                DB_PASSWORD="${DB_PASS:-Saadshabib.12}"
            fi

            echo "1. Checking question count BEFORE wipe..."
            BEFORE_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank 2>/dev/null || echo "0")
            echo "Total questions before wipe: $BEFORE_COUNT"

            CLEAR_FILE="/opt/medical-qbank/backend/clear_all_questions.sql"
            [ ! -f "$CLEAR_FILE" ] && CLEAR_FILE="/opt/medical-qbank/clear_all_questions.sql"

            if [ -f "$CLEAR_FILE" ]; then
                echo "2. Transferring wipe script into MySQL container..."
                echo "$SUDO_PW" | sudo -S docker cp "$CLEAR_FILE" medical_qbank_db:/tmp/clear.sql
                
                echo "3. Truncating questions tables (preserving users and specialties)..."
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "source /tmp/clear.sql"
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db rm -f /tmp/clear.sql
                echo "✅ Truncation completed successfully!"
            else
                echo "❌ Clear script not found at $CLEAR_FILE"
                exit 1
            fi

            echo "4. Checking question count AFTER wipe..."
            AFTER_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank 2>/dev/null || echo "0")
            echo "Total questions after wipe: $AFTER_COUNT"

            echo ""
            echo "======================================================"
            echo "🗑️ WIPE REPORT:"
            echo "   Previous Total:   $BEFORE_COUNT questions"
            echo "   Deleted:          -$BEFORE_COUNT questions"
            echo "   Current Total:    $AFTER_COUNT questions"
            echo "======================================================"
            echo "🎉 All questions wiped! Dashboard is completely clean."
