name: Production Zero-Downtime Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Backend Syntax
        run: |
          cd backend
          npm install --package-lock-only || true
          find src -name "*.js" -exec node --check {} +

      - name: Validate Admin Syntax and Build
        run: |
          cd admin-dashboard
          npm install
          npm run lint
          npm run build

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/automata-group/medical-q-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/automata-group/medical-q-ai-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./admin-dashboard
          push: true
          tags: ghcr.io/automata-group/medical-q-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-Deployment Cleanup (Free Space)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "🧹 Cleaning up server space before SCP..."
            SUDO_PW="${{ secrets.SERVER_PASSWORD }}"
            echo "$SUDO_PW" | sudo -S docker system prune -f
            echo "$SUDO_PW" | sudo -S docker image prune -af
            echo "✅ Space cleaned."

      - name: Copy docker-compose.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/medical-qbank"

      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "========== STARTING DEPLOYMENT =========="
            cd /opt/medical-qbank
            
            SUDO_PW="${{ secrets.SERVER_PASSWORD }}"
            
            echo "1. Logging into GHCR on server..."
            echo "$SUDO_PW" | sudo -S sh -c "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
            
            echo "2. Cleaning up old Docker artifacts to free space..."
            echo "$SUDO_PW" | sudo -S docker system prune -f
            echo "$SUDO_PW" | sudo -S docker image prune -af

            echo "3. Pulling latest images..."
            echo "$SUDO_PW" | sudo -S docker compose pull
            
            echo "3. Stopping host Nginx to free up ports 80/443..."
            echo "$SUDO_PW" | sudo -S systemctl stop nginx || true
            echo "$SUDO_PW" | sudo -S systemctl disable nginx || true
            
            echo "4. Restarting services with Caddy and Secure Network..."
            export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            export MOYASAR_API_KEY="${{ secrets.MOYASAR_API_KEY }}"
            export MOYASAR_PUBLISHABLE_KEY="${{ secrets.MOYASAR_PUBLISHABLE_KEY }}"
            echo "$SUDO_PW" | sudo -E -S docker compose up -d --force-recreate
            
            echo "4. Checking for early crashes..."
            sleep 15
            BACKEND_CONTAINER_ID=$(echo "$SUDO_PW" | sudo -S docker compose ps -q backend)
            BACKEND_STATUS=$(echo "$SUDO_PW" | sudo -S docker inspect -f '{{.State.Status}}' $BACKEND_CONTAINER_ID || echo "not_found")
            if [ "$BACKEND_STATUS" != "running" ]; then
                echo "❌ Backend crashed on startup! Status: $BACKEND_STATUS"
                echo "--- Crash Logs ---"
                echo "$SUDO_PW" | sudo -S docker compose logs backend
                exit 1
            fi

            echo "5. Finishing deployment and checking logs..."
            sleep 15
            echo "--- Backend Logs ---"
            echo "$SUDO_PW" | sudo -S docker compose logs --tail=50 backend
            
            echo "--- Health Check ---"
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/ || echo "000")
            if [ "$STATUS_CODE" -ne 200 ]; then
                echo "❌ Health check failed with status $STATUS_CODE"
                echo "--- Recent Logs (Detailed) ---"
                echo "$SUDO_PW" | sudo -S docker compose logs backend
                exit 1
            fi
            echo "✅ Backend HTTP health check passed!"

            echo "--- Log Verification ---"
            LOGS=$(echo "$SUDO_PW" | sudo -S docker compose logs --tail=100 backend)
            
            CHECK_DB=$(echo "$LOGS" | grep "Database connected successfully" || echo "")
            CHECK_MODELS=$(echo "$LOGS" | grep "All models synchronized successfully" || echo "")
            CHECK_RUNNING=$(echo "$LOGS" | grep "Server running on port" || echo "")

            if [ -z "$CHECK_DB" ] || [ -z "$CHECK_MODELS" ] || [ -z "$CHECK_RUNNING" ]; then
                echo "❌ Log verification failed! One or more success messages are missing."
                echo "--- Backend Logs ---"
                echo "$LOGS"
                exit 1
            fi
            echo "✅ Log verification passed! Database connected and models synced."

            echo "--- Admin Health Check ---"
            echo "Waiting for Caddy to issue SSL certificates (30s)..."
            sleep 30
            ADMIN_STATUS_CODE=$(curl -s -k -L -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 https://healthlicenseprep.com/ || echo "000")
            echo "Admin Status: $ADMIN_STATUS_CODE"
            if [ "$ADMIN_STATUS_CODE" -ne 200 ] && [ "$ADMIN_STATUS_CODE" -ne 304 ] && [ "$ADMIN_STATUS_CODE" -ne 301 ]; then
                echo "❌ Admin (via Caddy) health check failed with status $ADMIN_STATUS_CODE"
                echo "$SUDO_PW" | sudo -S docker compose logs caddy
                # exit 1 
            else
                echo "✅ Admin (via Caddy) health check passed!"
            fi
            
            echo "6. Cleaning up..."
            echo "$SUDO_PW" | sudo -S docker image prune -af
            
            echo "========== DEPLOYMENT SUCCESSFUL =========="
