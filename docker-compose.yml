services:
  caddy:
    image: caddy:latest
    container_name: medical_qbank_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - admin
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: medical_qbank_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-Saadshabib.12}
      MYSQL_DATABASE: medical_qbank
    volumes:
      - ./db/data:/var/lib/mysql
    # No public ports for database - strictly secure
    networks:
      - app-network

  backend:
    image: ghcr.io/automata-group/medical-q-backend:latest
    build: ./backend
    restart: always
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${DB_PASS:-Saadshabib.12}
      - DB_NAME=medical_qbank
      - DB_DIALECT=mysql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key}
      - JWT_EXPIRE=30d
      - CORS_ORIGIN=*
    depends_on:
      - db
    # Port 5000 is internal only now
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network

  admin:
    image: ghcr.io/automata-group/medical-q-admin:latest
    build: ./admin-dashboard
    container_name: medical_qbank_admin
    restart: always
    # Port 80 is internal only now
    depends_on:
      - backend
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: medical_qbank_redis
    restart: always
    # No public ports for redis - strictly secure
    networks:
      - app-network

  ai-worker:
    image: ghcr.io/automata-group/medical-q-ai-worker:latest
    build: ./backend
    container_name: medical_qbank_ai_worker
    restart: always
    command: npm run start-worker
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${DB_PASS:-Saadshabib.12}
      - DB_NAME=medical_qbank
      - DB_DIALECT=mysql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
