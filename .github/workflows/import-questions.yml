name: Import Questions (Dedicated Pipeline)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/insert_file2_questions.sql'
      - 'backend/insert_file1_questions.sql'
      - 'backend/insert_missing_questions.sql'
      - 'backend/scripts/import_docx_safe.js'

jobs:
  import-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Migration Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/merge_surgery_and_add_infection_control.sql,backend/insert_file1_questions.sql"
          target: "/opt/medical-qbank"

      - name: Execute Specialties Update and Questions Import
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "======================================================"
            echo "🚀 1. UPDATING SPECIALTIES (MERGE SURGERY & ADD INFECTION CONTROL)"
            echo "======================================================"
            cd /opt/medical-qbank
            SUDO_PW="${{ secrets.SERVER_PASSWORD }}"

            DB_PASSWORD=$(grep -E '^DB_PASS=' /opt/medical-qbank/.env 2>/dev/null | cut -d '=' -f2- | tr -d '\r"' || echo "")
            if [ -z "$DB_PASSWORD" ]; then
                DB_PASSWORD="${DB_PASS:-Saadshabib.12}"
            fi

            MERGE_SQL="/opt/medical-qbank/backend/merge_surgery_and_add_infection_control.sql"
            [ ! -f "$MERGE_SQL" ] && MERGE_SQL="/opt/medical-qbank/merge_surgery_and_add_infection_control.sql"

            if [ -f "$MERGE_SQL" ]; then
                echo "Applying specialty schema updates..."
                echo "$SUDO_PW" | sudo -S docker cp "$MERGE_SQL" medical_qbank_db:/tmp/merge_surgery.sql
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "source /tmp/merge_surgery.sql"
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db rm -f /tmp/merge_surgery.sql
                echo "✅ Specialties updated successfully!"
            fi

            echo ""
            echo "======================================================"
            echo "🚀 2. IMPORTING 1,851 QUESTIONS FROM 'اساله 1.docx'"
            echo "======================================================"

            echo "Checking question count before import..."
            BEFORE_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank 2>/dev/null || echo "0")
            echo "Total questions in DB before import: $BEFORE_COUNT"

            FILE1="/opt/medical-qbank/backend/insert_file1_questions.sql"
            [ ! -f "$FILE1" ] && FILE1="/opt/medical-qbank/insert_file1_questions.sql"

            if [ -f "$FILE1" ]; then
                echo "Transferring File 1 (1,851 questions) into MySQL container..."
                echo "$SUDO_PW" | sudo -S docker cp "$FILE1" medical_qbank_db:/tmp/file1.sql
                
                echo "Executing import for File 1..."
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "source /tmp/file1.sql"
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db rm -f /tmp/file1.sql
                echo "✅ File 1 migration completed successfully!"
            else
                echo "❌ File 1 not found!"
                exit 1
            fi

            AFTER_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank 2>/dev/null || echo "0")
            NEW_ADDED=$((AFTER_COUNT - BEFORE_COUNT))

            echo ""
            echo "======================================================"
            echo "📊 QUESTIONS COUNT BY SPECIALTY:"
            echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "
              SELECT s.id, s.name, COUNT(q.id) AS question_count 
              FROM Specialties s 
              LEFT JOIN Questions q ON q.specialtyId = s.id 
              GROUP BY s.id, s.name 
              ORDER BY s.sortOrder, s.id;
            "
            echo "======================================================"
            echo "📊 FINAL IMPORT REPORT:"
            echo "   Previous Total:   $BEFORE_COUNT questions"
            echo "   New Questions:    +$NEW_ADDED added"
            echo "   Total in DB:      $AFTER_COUNT questions"
            echo "======================================================"
            echo "🎉 Pipeline finished successfully!"
