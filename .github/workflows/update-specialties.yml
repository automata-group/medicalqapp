name: Update Specialties (Merge Surgery & Add Infection Control)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/merge_surgery_and_add_infection_control.sql'

jobs:
  update-specialties:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy SQL Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/merge_surgery_and_add_infection_control.sql"
          target: "/opt/medical-qbank"

      - name: Execute Specialties Update on Database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "======================================================"
            echo "🔄 MERGING ORAL SURGERY & ADDING INFECTION CONTROL"
            echo "======================================================"
            cd /opt/medical-qbank
            SUDO_PW="${{ secrets.SERVER_PASSWORD }}"

            DB_PASSWORD=$(grep -E '^DB_PASS=' /opt/medical-qbank/.env 2>/dev/null | cut -d '=' -f2- | tr -d '\r"' || echo "")
            if [ -z "$DB_PASSWORD" ]; then
                DB_PASSWORD="${DB_PASS:-Saadshabib.12}"
            fi

            SQL_FILE="/opt/medical-qbank/backend/merge_surgery_and_add_infection_control.sql"
            [ ! -f "$SQL_FILE" ] && SQL_FILE="/opt/medical-qbank/merge_surgery_and_add_infection_control.sql"

            if [ -f "$SQL_FILE" ]; then
                echo "1. Transferring migration script into MySQL container..."
                echo "$SUDO_PW" | sudo -S docker cp "$SQL_FILE" medical_qbank_db:/tmp/merge_surgery.sql
                
                echo "2. Executing specialty updates..."
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "source /tmp/merge_surgery.sql"
                echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db rm -f /tmp/merge_surgery.sql
                echo "✅ Specialty migration completed successfully!"
            else
                echo "❌ Script not found at $SQL_FILE"
                exit 1
            fi

            echo ""
            echo "======================================================"
            echo "📋 CURRENT SPECIALTIES IN DATABASE:"
            echo "$SUDO_PW" | sudo -S docker exec -i medical_qbank_db mysql -u root -p"$DB_PASSWORD" medical_qbank -e "SELECT id, name, sortOrder, isActive FROM Specialties ORDER BY sortOrder, id;"
            echo "======================================================"
