name: Import Questions (Dedicated Pipeline)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/insert_file2_questions.sql'
      - '.github/workflows/import-questions.yml'

jobs:
  import-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy File 2 Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/insert_file2_questions.sql"
          target: "/opt/medical-qbank"

      - name: Execute Incremental Deduplicated Import for File 2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "======================================================"
            echo "🚀 IMPORTING 633 NEW QUESTIONS FROM 'اساله 2.docx'"
            echo "======================================================"
            cd /opt/medical-qbank
            SUDO_PW="${{ secrets.SERVER_PASSWORD }}"

            echo "Checking questions count in DB before import..."
            BEFORE_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec medical_qbank_db sh -c 'mysql -u root -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank' 2>/dev/null || echo "0")
            echo "Total questions in DB before import: $BEFORE_COUNT"

            FILE2="/opt/medical-qbank/backend/insert_file2_questions.sql"
            [ ! -f "$FILE2" ] && FILE2="/opt/medical-qbank/insert_file2_questions.sql"

            echo "Transferring File 2 into MySQL container..."
            echo "$SUDO_PW" | sudo -S docker cp "$FILE2" medical_qbank_db:/tmp/file2.sql
            echo "Executing import for File 2..."
            echo "$SUDO_PW" | sudo -S docker exec medical_qbank_db sh -c 'mysql -u root -p"$MYSQL_ROOT_PASSWORD" medical_qbank -e "source /tmp/file2.sql"'
            echo "$SUDO_PW" | sudo -S docker exec medical_qbank_db rm -f /tmp/file2.sql
            echo "✅ File 2 (633 questions) imported successfully!"

            echo ""
            echo "======================================================"
            echo "📊 QUESTIONS COUNT BY SPECIALTY:"
            echo "$SUDO_PW" | sudo -S docker exec medical_qbank_db sh -c 'mysql -u root -p"$MYSQL_ROOT_PASSWORD" medical_qbank -e "
              SELECT s.id, s.name, COUNT(q.id) AS question_count 
              FROM Specialties s 
              LEFT JOIN Questions q ON q.specialtyId = s.id 
              GROUP BY s.id, s.name 
              ORDER BY s.sortOrder, s.id;
            "'

            AFTER_COUNT=$(echo "$SUDO_PW" | sudo -S docker exec medical_qbank_db sh -c 'mysql -u root -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM Questions;" medical_qbank' 2>/dev/null || echo "0")
            NEW_ADDED=$((AFTER_COUNT - BEFORE_COUNT))

            echo ""
            echo "======================================================"
            echo "📊 TOTAL QUESTIONS IN DATABASE:"
            echo "   Previous Total:   $BEFORE_COUNT questions"
            echo "   New Added:        +$NEW_ADDED questions"
            echo "   New Total in DB:  $AFTER_COUNT questions"
            echo "======================================================"
